<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Clientes que Mais Compraram</title>
    <link rel="stylesheet" href="../menu.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .report-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .chart-container {
            margin: 30px 0;
            position: relative;
            height: 500px;
        }
        .filters {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .filters select, .filters input, .filters button {
            padding: 8px 15px;
            margin-right: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .filters button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .filters button:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .customer-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #555;
        }
        .customer-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-ativo {
            background-color: #d4edda;
            color: #155724;
        }
        .status-inativo {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <header>
        <div class="topo">
            <h3>Relatório de Clientes que Mais Compraram</h3>
            <div class="user-section">
                <button id="btnLogin" onclick="redirecionarLogin()" class="hidden">Login</button>
                <div id="userInfo" class="user-info hidden" onclick="logout()">
                    <span id="userName"></span>
                    <span class="logout-tooltip">Clique para deslogar</span>
                </div>
                <button id="btnImprimir" class="print-button" onclick="window.print()">
                    <i class="fas fa-print"></i> Imprimir
                </button>
            </div>
        </div>
        <nav class="nav">
            <ul class="nav__menu">
                <li class="nav__menu-item"><a href="../menu.html">Voltar ao Menu</a></li>
            </ul>
        </nav>
    </header>

    <div class="report-container">
        <h1>Relatório de Clientes que Mais Compraram</h1>
        <div id="loading" class="loading">Carregando dados do relatório...</div>
        
        <div class="filters">
            <div>
                <label for="startDate">Data Inicial:</label>
                <input type="date" id="startDate">
                
                <label for="endDate">Data Final:</label>
                <input type="date" id="endDate">
                
                <label for="limit">Top N:</label>
                <select id="limit">
                    <option value="5">Top 5</option>
                    <option value="10" selected>Top 10</option>
                    <option value="20">Top 20</option>
                    <option value="50">Top 50</option>
                    <option value="0">Todos</option>
                </select>
                
                <button id="btnGerarRelatorio">Gerar Relatório</button>
                <button id="btnExportarPDF" style="background-color: #f44336;">Exportar PDF</button>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="customersChart"></canvas>
        </div>

        <div id="tabelaClientes">
            <h3>Detalhamento dos Clientes</h3>
            <div style="max-height: 500px; overflow-y: auto;">
                <table id="tabelaDados">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Cliente</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Total Gasto (R$)</th>
                            <th>Nº de Compras</th>
                            <th>Ticket Médio (R$)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo">
                        <!-- Os dados serão preenchidos via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @media print {
            .topo, .nav, .filters, .print-hide {
                display: none !important;
            }
            body {
                padding: 20px;
                font-size: 12px;
            }
            .report-container {
                max-width: 100%;
                box-shadow: none;
                padding: 0;
                margin: 0;
            }
            .chart-container {
                page-break-inside: avoid;
                height: 300px !important;
            }
            table {
                width: 100%;
                font-size: 10px;
            }
            th, td {
                padding: 4px 8px !important;
            }
            h1, h2, h3 {
                margin: 10px 0 !important;
            }
        }
        .print-button {
            background-color: #4a6fa5;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        .print-button:hover {
            background-color: #3a5a80;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }
    </style>
    <script src="../menu.js"></script>
    <script>
        // Verifica se o menu.js foi carregado
        if (typeof verificarSeUsuarioEstaLogadoBackend === 'function') {
            verificarSeUsuarioEstaLogadoBackend();
        }
        document.addEventListener('DOMContentLoaded', function() {
            // Define as datas padrão (últimos 6 meses)
            const endDate = new Date();
            const startDate = new Date();
            startDate.setMonth(startDate.getMonth() - 6);
            
            document.getElementById('startDate').valueAsDate = startDate;
            document.getElementById('endDate').valueAsDate = endDate;
            
            // Função para gerar cores aleatórias
            function getRandomColor() {
                const letters = '0123456789ABCDEF';
                let color = '#';
                for (let i = 0; i < 6; i++) {
                    color += letters[Math.floor(Math.random() * 16)];
                }
                return color;
            }
            
            // Inicializa o gráfico vazio
            const ctx = document.getElementById('customersChart').getContext('2d');
            let customersChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Total Gasto (R$)',
                        data: [],
                        backgroundColor: [],
                        borderColor: [],
                        borderWidth: 1,
                        yAxisID: 'y'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Valor Gasto (R$)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Clientes'
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(context.parsed.y);
                                    }
                                    return label;
                                }
                            }
                        },
                        legend: {
                            display: false
                        }
                    }
                }
            });

            // Função para formatar a data para YYYY-MM-DD
            function formatDate(date) {
                const d = new Date(date);
                let month = '' + (d.getMonth() + 1);
                let day = '' + d.getDate();
                const year = d.getFullYear();

                if (month.length < 2) month = '0' + month;
                if (day.length < 2) day = '0' + day;

                return [year, month, day].join('-');
            }

            // Função para obter iniciais do nome
            function getInitials(name) {
                return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            }

            // Mostrar indicador de carregamento
            function mostrarCarregamento(mostrar) {
                const loadingElement = document.getElementById('loading');
                if (mostrar) {
                    loadingElement.style.display = 'block';
                } else {
                    loadingElement.style.display = 'none';
                }
            }

            // Função para carregar os dados do relatório
            async function carregarDadosRelatorio(dataInicio, dataFim, limite) {
                try {
                    mostrarCarregamento(true);
                    
                    // Validação dos parâmetros
                    if (!dataInicio || !dataFim) {
                        throw new Error('Por favor, selecione um intervalo de datas válido.');
                    }
                    
                    // Formata as datas para o formato YYYY-MM-DD
                    const startDate = new Date(dataInicio).toISOString().split('T')[0];
                    const endDate = new Date(dataFim).toISOString().split('T')[0];
                    
                    console.log('Enviando requisição para:', `http://localhost:3001/api/relatorios/clientes-mais-compraram?dataInicio=${startDate}&dataFim=${endDate}&limite=${limite}`);
                    
                    const response = await fetch(`http://localhost:3001/api/relatorios/clientes-mais-compraram?dataInicio=${startDate}&dataFim=${endDate}&limite=${limite}`, {
                        method: 'GET',
                        credentials: 'include', // Importante para enviar os cookies de autenticação
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    console.log('Resposta recebida. Status:', response.status);
                    
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        console.error('Erro na resposta da API:', errorData);
                        throw new Error(errorData.message || `Erro na requisição: ${response.status} ${response.statusText}`);
                    }
                    
                    const responseData = await response.json();
                    console.log('Dados recebidos:', responseData);
                    
                    // Verifica se a resposta tem a estrutura esperada
                    if (!responseData || !Array.isArray(responseData.data)) {
                        throw new Error('Dados recebidos não estão no formato esperado');
                    }
                    
                    const data = responseData.data;
                    
                    // Gera cores aleatórias para o gráfico
                    const backgroundColors = [];
                    const borderColors = [];
                    
                    data.forEach(() => {
                        const color = getRandomColor();
                        backgroundColors.push(color + '80'); // Adiciona transparência
                        borderColors.push(color);
                    });
                    
                    // Atualiza o gráfico
                    customersChart.data.labels = data.map(item => item.nomeCliente);
                    customersChart.data.datasets[0].data = data.map(item => item.totalGasto);
                    customersChart.data.datasets[0].backgroundColor = backgroundColors;
                    customersChart.data.datasets[0].borderColor = borderColors;
                    customersChart.update();
                    
                    // Preenche a tabela
                    const tabelaCorpo = document.getElementById('tabelaCorpo');
                    tabelaCorpo.innerHTML = '';
                    
                    data.forEach((item, index) => {
                        const row = document.createElement('tr');
                        const statusClass = item.ativo ? 'status-ativo' : 'status-inativo';
                        const statusText = item.ativo ? 'Ativo' : 'Inativo';
                        
                        row.innerHTML = `
                            <td>${index + 1}</td>
                            <td>
                                <div class="customer-cell">
                                    <div class="customer-avatar" style="background-color: ${backgroundColors[index].replace('80', '')}">
                                        ${getInitials(item.nomeCliente)}
                                    </div>
                                    ${item.nomeCliente}
                                </div>
                            </td>
                            <td>${item.email || 'N/A'}</td>
                            <td>${item.telefone || 'N/A'}</td>
                            <td>R$ ${item.totalGasto.toFixed(2).replace(/\./g, ',')}</td>
                            <td>${item.quantidadeCompras}</td>
                            <td>R$ ${item.ticketMedio.toFixed(2).replace(/\./g, ',')}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        `;
                        tabelaCorpo.appendChild(row);
                    });
                    
                } catch (error) {
                    console.error('Erro ao carregar dados do relatório:', error);
                    
                    // Limpa os dados atuais
                    customersChart.data.labels = [];
                    customersChart.data.datasets[0].data = [];
                    customersChart.update();
                    document.getElementById('tabelaCorpo').innerHTML = '';
                    
                    // Exibe mensagem de erro amigável
                    const errorMessage = error.message || 'Ocorreu um erro ao carregar os dados do relatório. Por favor, tente novamente.';
                    
                    // Cria uma linha de erro na tabela
                    const tabelaCorpo = document.getElementById('tabelaCorpo');
                    const errorRow = document.createElement('tr');
                    errorRow.innerHTML = `
                        <td colspan="8" class="error-message">
                            <i class="fas fa-exclamation-triangle"></i> ${errorMessage}
                        </td>
                    `;
                    tabelaCorpo.appendChild(errorRow);
                    
                    // Mostra um alerta apenas se for um erro crítico
                    if (!error.message || !error.message.includes('Nenhum dado encontrado')) {
                        alert(`Erro: ${errorMessage}`);
                    }
                } finally {
                    mostrarCarregamento(false);
                }
            }
            
            // Evento do botão Gerar Relatório
            document.getElementById('btnGerarRelatorio').addEventListener('click', function() {
                const dataInicio = document.getElementById('startDate').value;
                const dataFim = document.getElementById('endDate').value;
                const limite = document.getElementById('limit').value;
                
                if (!dataInicio || !dataFim) {
                    alert('Por favor, selecione as datas de início e fim.');
                    return;
                }
                
                if (new Date(dataInicio) > new Date(dataFim)) {
                    alert('A data inicial não pode ser maior que a data final.');
                    return;
                }
                
                carregarDadosRelatorio(dataInicio, dataFim, limite);
            });
            
            // Evento do botão Exportar PDF
            document.getElementById('btnExportarPDF').addEventListener('click', function() {
                alert('Funcionalidade de exportação para PDF será implementada em breve.');
                // Implementar lógica de exportação para PDF aqui
            });
            
            // Carrega os dados iniciais
            carregarDadosRelatorio(
                formatDate(startDate), 
                formatDate(endDate), 
                document.getElementById('limit').value
            );
        });
    </script>
</body>
</html>
