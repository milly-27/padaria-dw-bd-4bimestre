<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes que Mais Compraram - Padaria DW</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/frontend/css/styles.css">
    <link rel="stylesheet" href="/frontend/relatorios/css/relatorios.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="report-header">
            <h1><i class="fas fa-users"></i> Relatório de Clientes que Mais Compraram</h1>
            <div class="actions">
                <button id="toggleChartType" class="btn btn-secondary" style="margin-right: 10px;">
                    <i class="fas fa-chart-pie"></i> Visualização em Pizza
                </button>
                <button id="printBtn" class="btn btn-print"><i class="fas fa-print"></i> Imprimir</button>
                <button id="exportPdfBtn" class="btn btn-export"><i class="far fa-file-pdf"></i> PDF</button>
                <button id="exportExcelBtn" class="btn btn-export"><i class="far fa-file-excel"></i> Excel</button>
            </div>
        </header>

        <div class="filters">
            <div class="filter-group">
                <label for="dataInicio">Data Inicial:</label>
                <input type="date" id="dataInicio" class="form-control">
            </div>
            <div class="filter-group">
                <label for="dataFim">Data Final:</label>
                <input type="date" id="dataFim" class="form-control">
            </div>
            <div class="filter-group">
                <label for="limite">Limite:</label>
                <select id="limite" class="form-control">
                    <option value="5">Top 5</option>
                    <option value="10" selected>Top 10</option>
                    <option value="20">Top 20</option>
                    <option value="50">Top 50</option>
                    <option value="100">Top 100</option>
                </select>
            </div>
            <button id="filtrarBtn" class="btn btn-primary"><i class="fas fa-filter"></i> Filtrar</button>
        </div>

        <div class="summary-cards">
            <div class="card">
                <div class="card-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="card-content">
                    <h3>Total de Clientes</h3>
                    <p id="totalClientes">0</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <div class="card-content">
                    <h3>Total de Pedidos</h3>
                    <p id="totalPedidos">0</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon">
                    <i class="fas fa-dollar-sign"></i>
                </div>
                <div class="card-content">
                    <h3>Faturamento Total</h3>
                    <p id="faturamentoTotal">R$ 0,00</p>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="clientesChart"></canvas>
        </div>

        <div class="table-responsive">
            <table id="tabelaClientes" class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Cliente</th>
                        <th>CPF</th>
                        <th>Total de Pedidos</th>
                        <th>Valor Total Gasto</th>
                        <th>Ticket Médio</th>
                    </tr>
                </thead>
                <tbody id="tabelaClientesBody">
                    <!-- Dados serão preenchidos via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p>Carregando dados...</p>
    </div>

    <script src="js/utils.js"></script>
    <script type="module">
        // Importa as funções necessárias do utils.js
        import { 
            formatCurrency, 
            formatDate, 
            getMonthName, 
            showLoading, 
            hideLoading, 
            showError, 
            fetchData,
            formatNumber
        } from '/frontend/relatorios/js/utils.js';
        
        // Expõe as funções para o escopo global
        window.formatCurrency = formatCurrency;
        window.formatDate = formatDate;
        window.getMonthName = getMonthName;
        window.showLoading = showLoading;
        window.hideLoading = hideLoading;
        window.showError = showError;
        window.fetchData = fetchData;
        window.formatNumber = formatNumber;
        let clientesChart = null;
        const API_BASE_URL = 'http://localhost:3001/api/relatorios';
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            carregarDados();
            
            // Configurar eventos
            document.getElementById('filtrarBtn').addEventListener('click', carregarDados);
            document.getElementById('printBtn').addEventListener('click', imprimirRelatorio);
            document.getElementById('exportPdfBtn').addEventListener('click', exportarParaPDF);
            document.getElementById('exportExcelBtn').addEventListener('click', exportarParaExcel);
            
            // Configurar datas padrão (últimos 30 dias)
            const hoje = new Date();
            const trintaDiasAtras = new Date();
            trintaDiasAtras.setDate(hoje.getDate() - 30);
            
            document.getElementById('dataFim').value = hoje.toISOString().split('T')[0];
            document.getElementById('dataInicio').value = trintaDiasAtras.toISOString().split('T')[0];
        });
        
        async function carregarDados() {
            try {
                showLoading('Carregando dados dos clientes...');
                console.log('🔍 Iniciando carregamento de dados de clientes...');
                
                const dataInicio = document.getElementById('dataInicio').value;
                const dataFim = document.getElementById('dataFim').value;
                const limite = document.getElementById('limite').value || 10;
                
                // Validar datas
                if (dataInicio && dataFim && new Date(dataInicio) > new Date(dataFim)) {
                    throw new Error('A data inicial não pode ser maior que a data final');
                }
                
                // Construir URL da API
                const params = new URLSearchParams();
                if (dataInicio) params.append('dataInicio', dataInicio);
                if (dataFim) params.append('dataFim', dataFim);
                params.append('limite', limite);
                
                console.log('📊 Parâmetros da requisição:', Object.fromEntries(params.entries()));
                
                // Fazer a requisição para a API
                const url = `relatorios/clientes-mais-compraram?${params.toString()}`;
                console.log('🌐 URL da requisição:', url);
                
                const response = await fetchData(url);
                console.log('📥 Resposta da API:', response);
                
                // Verifica se a resposta tem a estrutura esperada
                if (!response) {
                    throw new Error('Resposta vazia da API');
                }
                
                // Ajusta para lidar com diferentes formatos de resposta
                let dados = [];
                if (Array.isArray(response)) {
                    dados = response;
                } else if (response.data && Array.isArray(response.data)) {
                    dados = response.data;
                } else if (response.data) {
                    // Se for um único objeto, coloca em um array
                    dados = [response.data];
                }
                
                console.log('📊 Dados processados:', dados);
                
                if (!Array.isArray(dados) || dados.length === 0) {
                    console.warn('⚠️ Nenhum dado retornado da API ou formato inválido');
                    showInfo('Nenhum dado encontrado para os filtros selecionados.');
                    atualizarTabela([]);
                    if (clientesChart) {
                        clientesChart.destroy();
                        clientesChart = null;
                    }
                    return;
                }
                
                // Atualizar totais
                const totalPedidos = dados.reduce((acc, item) => acc + (parseInt(item.totalPedidos) || 0), 0);
                const totalFaturamento = dados.reduce((acc, item) => acc + (parseFloat(item.totalGasto) || 0), 0);
                
                document.getElementById('totalClientes').textContent = dados.length;
                document.getElementById('totalPedidos').textContent = formatNumber(totalPedidos);
                document.getElementById('faturamentoTotal').textContent = formatCurrency(totalFaturamento);
                
                // Atualizar tabela
                atualizarTabela(dados);
                
                // Atualizar gráfico
                atualizarGrafico(dados);
                
            } catch (error) {
                console.error('Erro ao carregar dados de clientes:', error);
                showError('Erro ao carregar dados do relatório. Verifique o console para mais detalhes.');
            } finally {
                hideLoading();
            }
        }
        
        function atualizarTabela(dados) {
            const tbody = document.getElementById('tabelaClientesBody');
            
            if (!Array.isArray(dados) || dados.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center py-4">
                            <div class="empty-state">
                                <i class="fas fa-users fa-3x mb-3 text-muted"></i>
                                <p class="mb-0">Nenhum cliente encontrado com os filtros atuais.</p>
                            </div>
                        </td>
                    </tr>`;
                // Atualizar informações da tabela
                document.getElementById('tableInfo').textContent = 'Nenhum dado disponível';
                return;
            }
            
            tbody.innerHTML = '';
            
            dados.forEach((item, index) => {
                const totalPedidos = parseInt(item.totalPedidos) || 0;
                const totalGasto = parseFloat(item.totalGasto) || 0;
                const ticketMedio = totalPedidos > 0 ? totalGasto / totalPedidos : 0;
                const isClienteFrequente = totalPedidos > 5;
                const isClienteValioso = totalGasto > 1000;
                
                const tr = document.createElement('tr');
                tr.className = 'fade-in';
                tr.style.animationDelay = `${index * 0.05}s`;
                
                tr.innerHTML = `
                    <td class="text-center">${index + 1}</td>
                    <td>
                        <div class="client-name">${item.cliente || 'Cliente não identificado'}</div>
                        <div class="client-email">${item.email || 'E-mail não disponível'}</div>
                    </td>
                    <td>
                        <div>${formatarCPF(item.cpf) || 'CPF não informado'}</div>
                        <div class="client-email">${item.telefone || 'Telefone não informado'}</div>
                    </td>
                    <td class="text-center">
                        <span class="badge ${isClienteFrequente ? 'badge-success' : 'badge-primary'}">
                            ${formatNumber(totalPedidos)} ${totalPedidos === 1 ? 'pedido' : 'pedidos'}
                        </span>
                    </td>
                    <td class="text-end">
                        <div class="font-weight-bold">${formatCurrency(totalGasto)}</div>
                        <small class="text-muted">${formatNumber(totalPedidos)} ${totalPedidos === 1 ? 'compra' : 'compras'}</small>
                    </td>
                    <td class="text-end">
                        <div class="font-weight-bold">${formatCurrency(ticketMedio)}</div>
                        <small class="text-muted">por pedido</small>
                    </td>
                    <td class="text-center">
                        ${isClienteFrequente && isClienteValioso ? 
                            '<span class="badge badge-success"><i class="fas fa-crown"></i> Cliente Ouro</span>' : 
                            isClienteFrequente ? 
                            '<span class="badge badge-primary"><i class="fas fa-star"></i> Frequente</span>' : 
                            isClienteValioso ? 
                            '<span class="badge badge-primary"><i class="fas fa-gem"></i> Alto Valor</span>' : 
                            '<span class="badge">Novo</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            // Atualizar informações da tabela
            document.getElementById('tableInfo').textContent = `Exibindo ${dados.length} de ${dados.length} clientes`;
        }
        
        function formatarCPF(cpf) {
            if (!cpf) return '';
            cpf = cpf.replace(/\D/g, '');
            return cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        }
        
        function atualizarGrafico(dados) {
            const ctx = document.getElementById('clientesChart').getContext('2d');
            const chartContainer = document.querySelector('.chart-wrapper');
            
            // Destruir gráfico anterior se existir
            if (clientesChart) {
                clientesChart.destroy();
            }
            
            // Se não houver dados, mostrar mensagem
            if (dados.length === 0) {
                chartContainer.innerHTML = `
                    <div class="empty-chart">
                        <i class="fas fa-chart-pie fa-4x mb-3 text-muted"></i>
                        <p>Não há dados suficientes para exibir o gráfico</p>
                        <small class="text-muted">Tente ajustar os filtros ou selecionar outro período</small>
                    </div>`;
                return;
            }
            
            // Limpar mensagem de sem dados se existir
            chartContainer.innerHTML = '<canvas id="clientesChart"></canvas>';
            
            // Preparar dados para o gráfico
            const labels = dados.map(item => {
                // Pegar apenas o primeiro nome para melhor visualização
                const nome = item.cliente || 'Cliente';
                return nome.split(' ')[0];
            });
            
            const valores = dados.map(item => parseFloat(item.totalGasto));
            const qtdPedidos = dados.map(item => parseInt(item.totalPedidos));
            
            // Cores dinâmicas baseadas no tema
            const backgroundColors = [
                'rgba(92, 107, 192, 0.7)',
                'rgba(38, 166, 154, 0.7)',
                'rgba(41, 182, 246, 0.7)',
                'rgba(255, 167, 38, 0.7)',
                'rgba(239, 83, 80, 0.7)'
            ];
            
            const borderColors = [
                'rgba(92, 107, 192, 1)',
                'rgba(38, 166, 154, 1)',
                'rgba(41, 182, 246, 1)',
                'rgba(255, 167, 38, 1)',
                'rgba(239, 83, 80, 1)'
            ];
            
            // Configuração do gráfico
            const config = {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Valor Total Gasto',
                            data: valores,
                            backgroundColor: backgroundColors,
                            borderColor: borderColors,
                            borderWidth: 1,
                            borderRadius: 4,
                            barThickness: 'flex',
                            maxBarThickness: 60,
                            order: 1
                        },
                        {
                            label: 'Quantidade de Pedidos',
                            data: qtdPedidos,
                            type: 'line',
                            borderColor: 'rgba(255, 99, 132, 1)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            borderWidth: 2,
                            pointBackgroundColor: 'rgba(255, 99, 132, 1)',
                            pointBorderColor: '#fff',
                            pointHoverRadius: 5,
                            pointHoverBackgroundColor: 'rgba(255, 99, 132, 1)',
                            pointHoverBorderColor: '#fff',
                            pointHitRadius: 10,
                            pointBorderWidth: 2,
                            yAxisID: 'y1',
                            order: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 20,
                                font: {
                                    family: '"Roboto", sans-serif',
                                    size: 13
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(50, 50, 50, 0.9)',
                            titleFont: {
                                family: '"Roboto", sans-serif',
                                size: 14,
                                weight: 'bold'
                            },
                            bodyFont: {
                                family: '"Roboto", sans-serif',
                                size: 13
                            },
                            padding: 12,
                            usePointStyle: true,
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label === 'Valor Total Gasto') {
                                        label += `: R$ ${context.raw.toFixed(2).replace('.', ',')}`;
                                    } else if (label === 'Quantidade de Pedidos') {
                                        const cliente = dados[context.dataIndex];
                                        label = `${cliente.totalPedidos} pedido${cliente.totalPedidos !== 1 ? 's' : ''} realizados`;
                                    }
                                    return label;
                                },
                                afterLabel: function(context) {
                                    if (context.dataset.label === 'Valor Total Gasto') {
                                        const cliente = dados[context.dataIndex];
                                        const ticketMedio = cliente.totalGasto / cliente.totalPedidos || 0;
                                        return [`Ticket Médio: R$ ${ticketMedio.toFixed(2).replace('.', ',')}`, 
                                                `${cliente.totalPedidos} pedido${cliente.totalPedidos !== 1 ? 's' : ''} realizados`];
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false,
                                drawBorder: false
                            },
                            ticks: {
                                font: {
                                    family: '"Roboto", sans-serif',
                                    size: 12
                                },
                                maxRotation: 45,
                                minRotation: 45,
                                padding: 10
                            }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Valor Total Gasto (R$)',
                                font: {
                                    family: '"Roboto", sans-serif',
                                    size: 12,
                                    weight: 'bold'
                                }
                            },
                            grid: {
                                drawBorder: false,
                                color: function(context) {
                                    if (context.tick.value === 0) {
                                        return 'rgba(0, 0, 0, 0.1)';
                                    }
                                    return 'rgba(0, 0, 0, 0.05)';
                                }
                            },
                            ticks: {
                                font: {
                                    family: '"Roboto", sans-serif',
                                    size: 11
                                },
                                callback: function(value) {
                                    return 'R$ ' + value.toLocaleString('pt-BR', {minimumFractionDigits: 0, maximumFractionDigits: 0});
                                },
                                padding: 5
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: 'Quantidade de Pedidos',
                                font: {
                                    family: '"Roboto", sans-serif',
                                    size: 12,
                                    weight: 'bold'
                                }
                            },
                            grid: {
                                drawOnChartArea: false,
                                drawBorder: false
                            },
                            ticks: {
                                font: {
                                    family: '"Roboto", sans-serif',
                                    size: 11
                                },
                                precision: 0,
                                padding: 5
                            }
                        }
                    },
                    animation: {
                        duration: 1000,
                        easing: 'easeInOutQuart'
                    },
                    layout: {
                        padding: {
                            top: 10,
                            right: 20,
                            bottom: 10,
                            left: 10
                        }
                    },
                    elements: {
                        bar: {
                            borderRadius: 4
                        }
                    }
                }
            };
            
            // Criar o gráfico com a configuração
            clientesChart = new Chart(ctx, config);
            
            // Adicionar evento para alternar entre gráfico de barras e pizza
            document.getElementById('toggleChartType').addEventListener('click', function() {
                if (clientesChart.config.type === 'bar') {
                    // Salvar dados atuais
                    const barData = clientesChart.data.datasets[0].data;
                    const pieLabels = clientesChart.data.labels;
                    
                    // Configurar para gráfico de pizza
                    clientesChart.destroy();
                    clientesChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: pieLabels,
                            datasets: [{
                                data: barData,
                                backgroundColor: backgroundColors,
                                borderColor: '#fff',
                                borderWidth: 2,
                                hoverOffset: 10
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'right',
                                    labels: {
                                        padding: 20,
                                        usePointStyle: true,
                                        font: {
                                            family: '"Roboto", sans-serif',
                                            size: 12
                                        }
                                    }
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            const label = context.label || '';
                                            const value = context.raw || 0;
                                            const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                            const percentage = Math.round((value / total) * 100);
                                            return `${label}: R$ ${value.toFixed(2).replace('.', ',')} (${percentage}%)`;
                                        }
                                    }
                                }
                            },
                            cutout: '60%',
                            animation: {
                                animateScale: true,
                                animateRotate: true
                            }
                        }
                    });
                    
                    this.innerHTML = '<i class="fas fa-chart-bar"></i> Visualização em Barras';
                } else {
                    // Voltar para o gráfico de barras
                    clientesChart.destroy();
                    clientesChart = new Chart(ctx, config);
                    this.innerHTML = '<i class="fas fa-chart-pie"></i> Visualização em Pizza';
                }
            });
        }
        
        function imprimirRelatorio() {
            window.print();
        }
        
        function exportarParaPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Título
            doc.setFontSize(18);
            doc.text('Relatório de Clientes que Mais Compraram', 14, 15);
            
            // Data de emissão
            doc.setFontSize(10);
            doc.text(`Emitido em: ${new Date().toLocaleString('pt-BR')}`, 14, 25);
            
            // Filtros aplicados
            const dataInicio = document.getElementById('dataInicio').value;
            const dataFim = document.getElementById('dataFim').value;
            const limite = document.getElementById('limite').value;
            
            let filtros = [];
            if (dataInicio) filtros.push(`De: ${formatDate(dataInicio)}`);
            if (dataFim) filtros.push(filtros.length > 0 ? `Até: ${formatDate(dataFim)}` : `Até: ${formatDate(dataFim)}`);
            filtros.push(`Limite: Top ${limite}`);
            
            doc.setFontSize(10);
            doc.text(`Filtros: ${filtros.join(' | ')}`, 14, 35);
            
            // Tabela de dados
            const headers = [['#', 'Cliente', 'CPF', 'Total de Pedidos', 'Valor Total (R$)', 'Ticket Médio (R$)']];
            const rows = [];
            
            document.querySelectorAll('#tabelaClientes tbody tr').forEach((row, index) => {
                const cols = row.querySelectorAll('td');
                rows.push([
                    (index + 1).toString(),
                    cols[1].textContent,
                    cols[2].textContent,
                    cols[3].textContent,
                    cols[4].textContent,
                    cols[5].textContent
                ]);
            });
            
            doc.autoTable({
                head: headers,
                body: rows,
                startY: 45,
                styles: { fontSize: 8 },
                headStyles: { fillColor: [75, 192, 192] },
                columnStyles: {
                    0: { cellWidth: 10 },
                    1: { cellWidth: 50 },
                    2: { cellWidth: 30 },
                    3: { cellWidth: 25 },
                    4: { cellWidth: 25 },
                    5: { cellWidth: 25 }
                }
            });
            
            // Adicionar totais
            const finalY = doc.lastAutoTable.finalY + 10;
            doc.setFontSize(10);
            doc.text(`Total de Clientes: ${document.getElementById('totalClientes').textContent}`, 14, finalY);
            doc.text(`Total de Pedidos: ${document.getElementById('totalPedidos').textContent}`, 14, finalY + 5);
            doc.text(`Faturamento Total: ${document.getElementById('faturamentoTotal').textContent}`, 14, finalY + 10);
            
            // Salvar o PDF
            doc.save(`relatorio-clientes-${new Date().toISOString().split('T')[0]}.pdf`);
        }
        
        function exportarParaExcel() {
            // Criar uma nova planilha
            const wb = XLSX.utils.book_new();
            
            // Preparar os dados
            const headers = ['#', 'Cliente', 'CPF', 'Total de Pedidos', 'Valor Total (R$)', 'Ticket Médio (R$)'];
            const rows = [];
            
            document.querySelectorAll('#tabelaClientes tbody tr').forEach((row, index) => {
                const cols = row.querySelectorAll('td');
                rows.push([
                    index + 1,
                    cols[1].textContent,
                    cols[2].textContent,
                    parseInt(cols[3].textContent.replace(/\./g, '')),
                    parseFloat(cols[4].textContent.replace(/[^0-9,]/g, '').replace(',', '.')),
                    parseFloat(cols[5].textContent.replace(/[^0-9,]/g, '').replace(',', '.'))
                ]);
            });
            
            // Adicionar totais
            rows.push(
                [],
                ['Total de Clientes:', document.getElementById('totalClientes').textContent],
                ['Total de Pedidos:', document.getElementById('totalPedidos').textContent],
                ['Faturamento Total:', document.getElementById('faturamentoTotal').textContent]
            );
            
            // Criar a planilha
            const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
            
            // Adicionar a planilha ao livro
            XLSX.utils.book_append_sheet(wb, ws, 'Clientes Mais Compradores');
            
            // Gerar o arquivo Excel
            XLSX.writeFile(wb, `relatorio-clientes-${new Date().toISOString().split('T')[0]}.xlsx`);
        }
    </script>
</body>
</html>
