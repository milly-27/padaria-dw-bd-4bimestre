<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Vendas Mensais</title>
    <link rel="stylesheet" href="../menu.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .report-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .chart-container {
            margin: 30px 0;
            position: relative;
            height: 400px;
        }
        .filters {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .filters select, .filters button {
            padding: 8px 15px;
            margin-right: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .filters button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .filters button:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <header>
        <div class="topo">
            <h3>Relatório de Vendas Mensais</h3>
            <div class="user-section">
                <button id="btnLogin" onclick="redirecionarLogin()" class="hidden">Login</button>
                <div id="userInfo" class="user-info hidden" onclick="logout()">
                    <span id="userName"></span>
                    <span class="logout-tooltip">Clique para deslogar</span>
                </div>
                <button id="btnImprimir" class="print-button" onclick="window.print()">
                    <i class="fas fa-print"></i> Imprimir
                </button>
            </div>
        </div>
        <nav class="nav">
            <ul class="nav__menu">
                <li class="nav__menu-item"><a href="../menu.html">Voltar ao Menu</a></li>
            </ul>
        </nav>
    </header>

    <div class="report-container">
        <h1>Relatório de Vendas Mensais</h1>
        <div id="loading" class="loading">Carregando dados do relatório...</div>
        
        <div class="filters">
            <label for="year">Ano:</label>
            <select id="year">
                <option value="2023">2023</option>
                <option value="2024" selected>2024</option>
                <option value="2025">2025</option>
            </select>
            
            <button id="btnGerarRelatorio">Gerar Relatório</button>
            <button id="btnExportarPDF" style="background-color: #f44336;">Exportar PDF</button>
        </div>

        <div class="chart-container">
            <canvas id="salesChart"></canvas>
        </div>

        <div id="tabelaVendas">
            <h3>Detalhamento das Vendas</h3>
            <table id="tabelaDados">
                <thead>
                    <tr>
                        <th>Mês</th>
                        <th>Total de Vendas (R$)</th>
                        <th>Quantidade de Pedidos</th>
                        <th>Ticket Médio (R$)</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo">
                    <!-- Os dados serão preenchidos via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @media print {
            .topo, .nav, .filters, .print-hide {
                display: none !important;
            }
            body {
                padding: 20px;
                font-size: 12px;
            }
            .report-container {
                max-width: 100%;
                box-shadow: none;
                padding: 0;
                margin: 0;
            }
            .chart-container {
                page-break-inside: avoid;
                height: 300px !important;
            }
            table {
                width: 100%;
                font-size: 10px;
            }
            th, td {
                padding: 4px 8px !important;
            }
            h1, h2, h3 {
                margin: 10px 0 !important;
            }
        }
        .print-button {
            background-color: #4a6fa5;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        .print-button:hover {
            background-color: #3a5a80;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }
    </style>
    <script src="../menu.js"></script>
    <script>
        // Verifica se o menu.js foi carregado
        if (typeof verificarSeUsuarioEstaLogadoBackend === 'function') {
            verificarSeUsuarioEstaLogadoBackend();
        }
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializa o gráfico vazio
            const ctx = document.getElementById('salesChart').getContext('2d');
            let salesChart = new Chart(ctx, {
                type: 'bar', // ou 'line' para gráfico de linhas
                data: {
                    labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'],
                    datasets: [{
                        label: 'Vendas Mensais (R$)',
                        data: [],
                        backgroundColor: 'rgba(54, 162, 235, 0.5)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Valor em R$'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Meses'
                            }
                        }
                    }
                }
            });

            // Mostrar/ocultar indicador de carregamento
            function mostrarCarregamento(mostrar) {
                const loadingElement = document.getElementById('loading');
                if (mostrar) {
                    loadingElement.style.display = 'block';
                } else {
                    loadingElement.style.display = 'none';
                }
            }

            // Função para carregar os dados do relatório
            async function carregarDadosRelatorio(ano) {
                try {
                    mostrarCarregamento(true);
                    const response = await fetch(`http://localhost:3001/api/relatorios/vendas-mensais?ano=${ano}`);
                    
                    if (!response.ok) {
                        throw new Error(`Erro na requisição: ${response.status} ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    
                    if (!Array.isArray(data)) {
                        throw new Error('Dados recebidos não estão no formato esperado');
                    }
                    
                    // Atualiza o gráfico
                    salesChart.data.datasets[0].data = data.map(item => item.totalVendas);
                    salesChart.update();
                    
                    // Preenche a tabela
                    const tabelaCorpo = document.getElementById('tabelaCorpo');
                    tabelaCorpo.innerHTML = '';
                    
                    data.forEach((item, index) => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${item.mes}</td>
                            <td>R$ ${item.totalVendas.toFixed(2).replace('.', ',')}</td>
                            <td>${item.quantidadePedidos}</td>
                            <td>R$ ${item.ticketMedio.toFixed(2).replace('.', ',')}</td>
                        `;
                        tabelaCorpo.appendChild(row);
                    });
                    
                } catch (error) {
                    console.error('Erro ao carregar dados do relatório:', error);
                    alert('Erro ao carregar dados do relatório: ' + error.message);
                } finally {
                    mostrarCarregamento(false);
                }
            }
            
            // Evento do botão Gerar Relatório
            document.getElementById('btnGerarRelatorio').addEventListener('click', function() {
                const ano = document.getElementById('year').value;
                carregarDadosRelatorio(ano);
            });
            
            // Evento do botão Exportar PDF
            document.getElementById('btnExportarPDF').addEventListener('click', function() {
                alert('Funcionalidade de exportação para PDF será implementada em breve.');
                // Implementar lógica de exportação para PDF aqui
            });
            
            // Carrega os dados iniciais
            carregarDadosRelatorio(document.getElementById('year').value);
        });
    </script>
</body>
</html>
