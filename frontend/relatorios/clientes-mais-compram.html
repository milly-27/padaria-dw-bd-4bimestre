<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes que Mais Compram - Sistema AVAP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        /* CSS INLINE - Evita problema MIME */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8b6f47;
            --secondary: #d4a574;
            --accent: #f5e6d3;
            --dark-brown: #5d4037;
            --cream: #faf8f3;
            --gold: #c9a961;
            --bg-light: #fff;
            --text-dark: #3e2723;
            --text-light: #6d4c41;
            --success-color: #66bb6a;
            --danger-color: #ef5350;
            --info-color: #29b6f6;
            --warning-color: #ffa726;
            --shadow-color: rgba(139, 111, 71, 0.15);
            --shadow-sm: 0 4px 15px var(--shadow-color);
            --shadow-md: 0 8px 25px var(--shadow-color);
            --shadow-lg: 0 15px 50px rgba(139, 111, 71, 0.2);
            --transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #faf8f3 0%, #f5e6d3 50%, #e8d5bf 100%);
            background-size: 400% 400%;
            animation: gradientDance 20s ease infinite;
            color: var(--text-dark);
            line-height: 1.7;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientDance {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            animation: fadeIn 0.5s ease-in-out;
            position: relative;
            z-index: 2;
        }

        .report-header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            color: var(--text-dark);
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(139, 111, 71, 0.15);
            margin-bottom: 2rem;
            border: 2px solid rgba(139, 111, 71, 0.1);
            animation: popIn 1s ease;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .header-titles {
            flex: 1;
            min-width: 250px;
        }

        .report-header h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.2rem;
            color: var(--primary);
            margin: 0;
            letter-spacing: 2px;
        }

        .report-subtitle {
            color: var(--text-light);
            margin: 0.5rem 0 0;
            font-size: 1.1rem;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-action i {
            margin-right: 6px;
        }

        .btn-excel {
            background: linear-gradient(135deg, #1d6f42, #166534);
            color: white;
        }

        .btn-excel:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(29, 111, 66, 0.4);
        }

        .btn-pdf {
            background: linear-gradient(135deg, #b91c1c, #991b1b);
            color: white;
        }

        .btn-pdf:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(185, 28, 28, 0.4);
        }

        .btn-print {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            color: white;
        }

        .btn-print:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(29, 78, 216, 0.4);
        }

        .filters {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 1.5rem;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(139, 111, 71, 0.15);
            margin-bottom: 2.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: flex-end;
            border: 2px solid rgba(139, 111, 71, 0.1);
            animation: fadeIn 0.8s ease;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .filter-group input,
        .filter-group select,
        .form-control {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 2px solid rgba(139, 111, 71, 0.2);
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            font-family: 'Poppins', sans-serif;
        }

        .filter-group input:focus,
        .filter-group select:focus,
        .form-control:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(139, 111, 71, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 111, 71, 0.3);
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-bottom: 3rem;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 2rem 1.5rem;
            box-shadow: 0 20px 60px rgba(139, 111, 71, 0.15);
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid rgba(139, 111, 71, 0.1);
            animation: popIn 1s ease;
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .summary-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 70px rgba(139, 111, 71, 0.2);
        }

        .summary-card .card-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 1.2rem;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(139, 111, 71, 0.1), rgba(212, 165, 116, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--primary);
        }

        .summary-card .card-content h3 {
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .summary-card .card-content p {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0.5rem 0 0;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(139, 111, 71, 0.15);
            margin-bottom: 2.5rem;
            border: 2px solid rgba(139, 111, 71, 0.1);
            animation: fadeIn 1s ease;
        }

        .chart-header {
            margin-bottom: 1.5rem;
        }

        .chart-title {
            font-family: 'Pacifico', cursive;
            color: var(--primary);
            margin: 0;
            font-size: 1.5rem;
        }

        .chart-container canvas {
            width: 100% !important;
            max-height: 400px;
        }

        .table-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(139, 111, 71, 0.15);
            overflow: hidden;
            margin-bottom: 2rem;
            border: 2px solid rgba(139, 111, 71, 0.1);
            animation: fadeIn 1.2s ease;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid rgba(139, 111, 71, 0.1);
        }

        th {
            background: linear-gradient(135deg, var(--primary), var(--dark-brown));
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        tbody tr:hover {
            background: linear-gradient(135deg, rgba(139, 111, 71, 0.05), rgba(212, 165, 116, 0.05));
        }

        tbody tr:nth-child(even) {
            background-color: rgba(250, 248, 243, 0.5);
        }

        .text-center {
            text-align: center !important;
        }

        .text-end {
            text-align: right !important;
        }

        .text-muted {
            color: var(--text-light);
            opacity: 0.8;
        }

        .message {
            padding: 1.2rem 1.5rem;
            border-radius: 20px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            box-shadow: var(--shadow-sm);
            animation: slideIn 0.5s ease;
        }

        .message-success {
            background: linear-gradient(135deg, #ebfbee, #d3f9d8);
            color: #2b8a3e;
            border: 2px solid #8ce99a;
        }

        .message-error {
            background: linear-gradient(135deg, #fff5f5, #ffe3e3);
            color: #c92a2a;
            border: 2px solid #ffa8a8;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay p {
            color: white;
            font-size: 1.2rem;
            margin-top: 1rem;
            font-weight: 500;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(139, 111, 71, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--text-light);
            opacity: 0.3;
            margin-bottom: 1rem;
        }

        .empty-state p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
            }
            
            .filters {
                flex-direction: column;
            }
            
            .filter-group {
                width: 100%;
            }
            
            .button-group {
                width: 100%;
                justify-content: stretch;
            }
            
            .btn-action {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div id="messages-container" class="position-fixed top-0 end-0 p-3" style="z-index: 11"></div>
    
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingMessage">Carregando...</p>
    </div>
    
    <div class="container">
        <header class="report-header">
            <div class="header-content">
                <div class="header-titles">
                    <h1><i class="bi bi-people-fill"></i> Clientes que Mais Compram</h1>
                    <p class="report-subtitle">Análise detalhada dos melhores clientes</p>
                </div>
                
                <div class="action-buttons">
                    <div class="button-group">
                        <button id="exportExcel" class="btn-action btn-excel">
                            <i class="bi bi-file-earmark-excel"></i> Excel
                        </button>
                        <button id="exportPdf" class="btn-action btn-pdf">
                            <i class="bi bi-file-pdf"></i> PDF
                        </button>
                        <button id="printReport" class="btn-action btn-print">
                            <i class="bi bi-printer"></i> Imprimir
                        </button>
                    </div>
                </div>
            </div>
        </header>
        
        <section class="filters">
            <div class="filter-group">
                <label for="dataInicio"><i class="bi bi-calendar"></i> Data Inicial</label>
                <input type="date" id="dataInicio" class="form-control">
            </div>
            
            <div class="filter-group">
                <label for="dataFim"><i class="bi bi-calendar"></i> Data Final</label>
                <input type="date" id="dataFim" class="form-control">
            </div>
            
            <div class="filter-group">
                <label for="cpf"><i class="bi bi-person-badge"></i> CPF</label>
                <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" maxlength="14">
            </div>
            
            <div class="filter-group">
                <label for="nome"><i class="bi bi-search"></i> Nome</label>
                <input type="text" id="nome" class="form-control" placeholder="Digite o nome do cliente">
            </div>
            
            <div class="filter-group">
                <label for="limite"><i class="bi bi-list-ol"></i> Limite</label>
                <select id="limite" class="form-control">
                    <option value="10">Top 10</option>
                    <option value="20" selected>Top 20</option>
                    <option value="50">Top 50</option>
                    <option value="100">Top 100</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label>&nbsp;</label>
                <button id="filtrarBtn" class="btn btn-primary w-100">
                    <i class="bi bi-funnel"></i> Aplicar Filtros
                </button>
            </div>
        </section>
        
        <section class="summary-cards">
            <div class="summary-card">
                <div class="card-icon">
                    <i class="bi bi-people"></i>
                </div>
                <div class="card-content">
                    <h3>Total de Clientes</h3>
                    <p id="totalClientes">0</p>
                </div>
            </div>
            
            <div class="summary-card">
                <div class="card-icon">
                    <i class="bi bi-cart-check"></i>
                </div>
                <div class="card-content">
                    <h3>Total de Pedidos</h3>
                    <p id="totalPedidos">0</p>
                </div>
            </div>
            
            <div class="summary-card">
                <div class="card-icon">
                    <i class="bi bi-currency-dollar"></i>
                </div>
                <div class="card-content">
                    <h3>Faturamento Total</h3>
                    <p id="faturamentoTotal">R$ 0,00</p>
                </div>
            </div>
            
            <div class="summary-card">
                <div class="card-icon">
                    <i class="bi bi-receipt"></i>
                </div>
                <div class="card-content">
                    <h3>Ticket Médio</h3>
                    <p id="ticketMedio">R$ 0,00</p>
                </div>
            </div>
        </section>
        
        <section class="chart-container">
            <div class="chart-header">
                <h2 class="chart-title">Top 10 Clientes</h2>
            </div>
            <canvas id="clientesChart"></canvas>
        </section>
        
        <section class="table-container">
            <table class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Cliente</th>
                        <th>CPF</th>
                        <th>Contato</th>
                        <th class="text-center">Pedidos</th>
                        <th class="text-end">Total Compras</th>
                        <th class="text-end">Ticket Médio</th>
                        <th class="text-center">Última Compra</th>
                    </tr>
                </thead>
                <tbody id="clientesTableBody">
                    <tr>
                        <td colspan="8" class="text-center py-4">
                            <div class="empty-state">
                                <i class="bi bi-hourglass-split"></i>
                                <p>Carregando dados...</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <script>
        let clientesChart = null;
        let dadosGlobais = [];
        const API_BASE_URL = 'http://localhost:3001';
        
        function formatCurrency(value) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value || 0);
        }
        
        function formatDate(date) {
            if (!date) return '-';
            const d = new Date(date);
            d.setMinutes(d.getMinutes() + d.getTimezoneOffset());
            return d.toLocaleDateString('pt-BR');
        }
        
        function showLoading(message = 'Carregando...') {
            document.getElementById('loadingMessage').textContent = message;
            document.getElementById('loadingOverlay').classList.add('active');
        }
        
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }
        
        function showMessage(message, type = 'info') {
            const container = document.getElementById('messages-container');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${type}`;
            messageDiv.innerHTML = message;
            container.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.style.opacity = '0';
                setTimeout(() => messageDiv.remove(), 300);
            }, 5000);
        }
        
        // Máscara de CPF
        document.getElementById('cpf').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            
            if (value.length > 9) {
                value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
            } else if (value.length > 6) {
                value = value.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
            } else if (value.length > 3) {
                value = value.replace(/(\d{3})(\d{1,3})/, '$1.$2');
            }
            
            e.target.value = value;
        });
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            const hoje = new Date();
            const trintaDiasAtras = new Date();
            trintaDiasAtras.setDate(hoje.getDate() - 90);
            
            document.getElementById('dataFim').value = hoje.toISOString().split('T')[0];
            document.getElementById('dataInicio').value = trintaDiasAtras.toISOString().split('T')[0];
            
            document.getElementById('filtrarBtn').addEventListener('click', carregarDados);
            document.getElementById('printReport').addEventListener('click', () => window.print());
            document.getElementById('exportPdf').addEventListener('click', exportarParaPDF);
            document.getElementById('exportExcel').addEventListener('click', exportarParaExcel);
            
            carregarDados();
        });
        
        async function carregarDados() {
            try {
                showLoading('Buscando dados dos clientes...');
                
                const params = new URLSearchParams();
                const dataInicio = document.getElementById('dataInicio').value;
                const dataFim = document.getElementById('dataFim').value;
                const cpf = document.getElementById('cpf').value;
                const nome = document.getElementById('nome').value;
                const limite = document.getElementById('limite').value;
                
                if (dataInicio) params.append('dataInicio', dataInicio);
                if (dataFim) params.append('dataFim', dataFim);
                if (cpf) params.append('cpf', cpf.replace(/\D/g, ''));
                if (nome) params.append('nome', nome);
                params.append('limite', limite);
                
                const url = `${API_BASE_URL}/api/relatorios/clientes-mais-compram?${params.toString()}`;
                console.log('🌐 Requisição:', url);
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Erro:', errorText);
                    throw new Error(`Erro ${response.status}: Verifique o console do backend`);
                }
                
                const result = await response.json();
                console.log('✅ Dados:', result);
                
                if (result.status === 'success' && result.data) {
                    dadosGlobais = result.data;
                    atualizarInterface(result.data, result.meta);
                    showMessage('Dados carregados com sucesso!', 'success');
                } else {
                    throw new Error('Formato de resposta inválido');
                }
                
            } catch (error) {
                console.error('❌ Erro:', error);
                showMessage('Erro: ' + error.message, 'error');
                atualizarInterface([], null);
            } finally {
                hideLoading();
            }
        }
        
        function atualizarInterface(dados, meta) {
            if (meta && meta.totais) {
                document.getElementById('totalClientes').textContent = meta.totais.total_clientes || 0;
                document.getElementById('totalPedidos').textContent = meta.totais.total_pedidos || 0;
                document.getElementById('faturamentoTotal').textContent = formatCurrency(meta.totais.total_vendas);
                document.getElementById('ticketMedio').textContent = formatCurrency(meta.totais.ticket_medio_geral);
            }
            
            atualizarTabela(dados);
            atualizarGrafico(dados);
        }
        
        function atualizarTabela(dados) {
            const tbody = document.getElementById('clientesTableBody');
            tbody.innerHTML = '';
            
            if (!dados || dados.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="8" class="text-center py-4">
                        <div class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <p>Nenhum cliente encontrado</p>
                        </div>
                    </td></tr>`;
                return;
            }
            
            dados.forEach((cliente, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center">${index + 1}</td>
                    <td>
                        <strong>${cliente.nome}</strong>
                        ${cliente.email && cliente.email !== 'N/A' ? `<br><small class="text-muted">${cliente.email}</small>` : ''}
                    </td>
                    <td>${cliente.cpf}</td>
                    <td>${cliente.telefone}</td>
                    <td class="text-center"><strong>${cliente.quantidade_pedidos}</strong></td>
                    <td class="text-end"><strong>${formatCurrency(cliente.total_compras)}</strong></td>
                    <td class="text-end">${formatCurrency(cliente.ticket_medio)}</td>
                    <td class="text-center">${formatDate(cliente.ultima_compra)}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function atualizarGrafico(dados) {
            const ctx = document.getElementById('clientesChart').getContext('2d');
            
            if (clientesChart) {
                clientesChart.destroy();
            }
            
            if (!dados || dados.length === 0) return;
            
            const top10 = dados.slice(0, 10);
            const labels = top10.map(c => c.nome.length > 20 ? c.nome.substring(0, 20) + '...' : c.nome);
            const valores = top10.map(c => c.total_compras);
            
            clientesChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total em Compras (R$)',
                        data: valores,
                        backgroundColor: 'rgba(139, 111, 71, 0.7)',
                        borderColor: 'rgba(139, 111, 71, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (context) => formatCurrency(context.parsed.y)
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: (value) => 'R$ ' + value.toLocaleString('pt-BR')
                            }
                        }
                    }
                }
            });
        }
        
        function exportarParaPDF() {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFontSize(18);
                doc.text('Relatorio de Clientes que Mais Compram', 14, 15);
                
                doc.setFontSize(10);
                doc.text(`Emitido em: ${new Date().toLocaleString('pt-BR')}`, 14, 25);
                
                const headers = [['#', 'Cliente', 'CPF', 'Pedidos', 'Total', 'Ticket Medio']];
                const rows = dadosGlobais.map((c, i) => [
                    (i + 1).toString(),
                    c.nome,
                    c.cpf,
                    c.quantidade_pedidos.toString(),
                    formatCurrency(c.total_compras),
                    formatCurrency(c.ticket_medio)
                ]);
                
                doc.autoTable({
                    head: headers,
                    body: rows,
                    startY: 35,
                    styles: { fontSize: 8 }
                });
                
                doc.save(`clientes-${new Date().toISOString().split('T')[0]}.pdf`);
                showMessage('PDF exportado com sucesso!', 'success');
            } catch (error) {
                console.error('Erro PDF:', error);
                showMessage('Erro ao gerar PDF', 'error');
            }
        }
        
        function exportarParaExcel() {
            try {
                const wb = XLSX.utils.book_new();
                const headers = ['#', 'Cliente', 'CPF', 'Telefone', 'Email', 'Pedidos', 'Total Compras', 'Ticket Medio', 'Ultima Compra'];
                const rows = dadosGlobais.map((c, i) => [
                    i + 1,
                    c.nome,
                    c.cpf,
                    c.telefone,
                    c.email,
                    c.quantidade_pedidos,
                    c.total_compras,
                    c.ticket_medio,
                    formatDate(c.ultima_compra)
                ]);
                
                const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
                XLSX.utils.book_append_sheet(wb, ws, 'Clientes');
                XLSX.writeFile(wb, `clientes-${new Date().toISOString().split('T')[0]}.xlsx`);
                showMessage('Excel exportado com sucesso!', 'success');
            } catch (error) {
                console.error('Erro Excel:', error);
                showMessage('Erro ao gerar Excel', 'error');
            }
        }
    </script>
</body>
</html>
